<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customers · Parrilla Vaca</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="customers">
    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Guest records</p>
            <h1>Customers</h1>
            <p class="sub">
              Contact details and visit history for returning guests.
            </p>
          </div>
          <div class="topbar__actions">
            <button class="btn btn--gold" id="newCustomer" type="button">
              Add customer
            </button>
          </div>
        </header>

        <section class="card">
          <div class="filters">
            <input
              class="input"
              type="search"
              id="customerSearch"
              placeholder="Search name, phone, or email"
            />
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Email</th>
                  <th>Visits</th>
                  <th>Last visit</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="customerBody">
                <tr>
                  <td colspan="6" class="empty">Loading…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="modalRoot"></div>
    <div class="toast-stack" id="toastStack"></div>
    <script src="js/app.js"></script>
  </body>
</html>
