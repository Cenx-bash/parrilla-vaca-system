<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tables · Parrilla Vaca</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="tables">
    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Floor plan</p>
            <h1>Tables</h1>
            <p class="sub">Capacity, location, and live availability.</p>
          </div>
          <div class="topbar__actions">
            <button class="btn btn--gold" id="newTable" type="button">
              Add table
            </button>
          </div>
        </header>

        <section class="card mb-16">
          <header class="card__head">
            <h2>Check availability</h2>
            <span class="muted" style="font-size: 12px"
              >Conflicts measured in a 2-hour window</span
            >
          </header>
          <div class="filters" style="margin-bottom: 14px">
            <input class="input" type="date" id="availDate" />
            <input class="input" type="time" id="availTime" value="19:00" />
            <input
              class="input"
              type="number"
              id="availGuests"
              min="1"
              max="40"
              value="2"
              style="width: 110px"
            />
            <button class="btn btn--ghost" id="checkAvail" type="button">
              Check
            </button>
          </div>
          <div class="avail-result" id="availResult"></div>
        </section>

        <section class="grid grid--tables" id="tableGrid"></section>
      </main>
    </div>

    <div id="modalRoot"></div>
    <div class="toast-stack" id="toastStack"></div>
    <script src="js/app.js"></script>
  </body>
</html>
