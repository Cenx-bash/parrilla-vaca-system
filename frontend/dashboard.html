<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Parrilla Vaca</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="topbar">
      <div>
        <p class="eyebrow">Service overview</p>
        <h1>Dashboard</h1>
        <p class="sub">Today's service at a glance.</p>
      </div>
      <div class="topbar__actions">
        <a class="btn btn--gold" href="reservations.html?new=1">New reservation</a>
        <a class="btn btn--ghost" href="requests.html">Log request</a>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <div class="grid grid--2">
      <section class="card">
        <header class="card__head">
          <h2>Today's schedule</h2>
          <span class="muted" id="todayLabel" style="font-size:12px"></span>
        </header>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Time</th><th>Guest</th><th>Party</th><th>Table</th><th>Status</th></tr></thead>
            <tbody id="todayBody"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <header class="card__head">
          <h2>Open requests</h2>
          <a class="link" href="requests.html">View all</a>
        </header>
        <ul class="feed" id="requestFeed"><li class="empty">Loading…</li></ul>
      </section>
    </div>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast-stack" id="toastStack"></div>
<script src="js/app.js"></script>
</body>
</html>
